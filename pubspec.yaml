name: quran_flutter
description: A multilingual Quran application, free for everyone as Sadakah Jariyah.
publish_to: 'none'
version: 1.0.0+15

environment:
  sdk: ^3.12.2

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  flutter_timezone: ^5.1.0
  http: ^1.6.0
  get_storage: ^2.1.1
  crypto: ^3.0.7
  quran_library:
    path: vendor/quran_library
  shared_preferences: ^2.5.5
  timezone: ^0.11.1
  web: ^1.1.1
  video_player: 2.14.1
  file_selector: 1.1.0
  share_plus: 13.3.1
  url_launcher: 6.3.3

dev_dependencies:
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  dio: ^5.9.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/yahyazlab.png
    - assets/brand/quran-haven-book-v2.png
    - assets/learning/quranic-corpus-morphology-0.4.txt
    - assets/learning/COPYING-GPL-3.0.txt
    - assets/learning/SOURCE.json
    - assets/fonts/OFL-NotoSansBengali.txt
    - assets/fonts/OFL-NotoSansSymbols.txt
    - assets/tutorials/ar/
    - assets/tutorials/en/
    - assets/tutorials/es/
  fonts:
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali.ttf
    - family: NotoSansSymbols
      fonts:
        - asset: assets/fonts/NotoSansSymbols.ttf

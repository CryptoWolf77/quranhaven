server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;
    server_tokens off;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, If-None-Match, If-Modified-Since" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag, Last-Modified" always;
    add_header X-Content-Type-Options "nosniff" always;

    # These are public Quran resources. No cookies or authentication are used.
    if ($request_method = OPTIONS) { return 204; }
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }

    location = /health { default_type text/plain; return 200 "ok\n"; }
    location = /v1/manifest.json {
        expires -1;
        try_files $uri =404;
    }
    location /v1/ {
        expires 1h;
        # .gz files must remain gzip FILES, not HTTP Content-Encoding: gzip.
        # The Flutter library decompresses them itself after download.
        gzip off;
        try_files $uri =404;
    }
    location / { return 404; }
}

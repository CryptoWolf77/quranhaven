# Only this gateway joins Coolify's proxy-facing network. No host ports are used.
# Recursion selects the last non-trusted hop, not a user-supplied first address.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from fc00::/7;
# https://www.cloudflare.com/ips-v4/ and /ips-v6/, verified 2026-09-07.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=account_requests:10m rate=15r/m;
limit_req_zone $binary_remote_addr zone=backup_requests:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=active_connections:5m;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log off;
    client_max_body_size 1100k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 15s;
    limit_conn active_connections 10;
    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 = @rate_limited;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;

    # Exact production browser origin, including errors generated by the gateway.
    set $cors_origin "";
    if ($http_origin = "https://quranhaven.org") {
        set $cors_origin "https://quranhaven.org";
    }
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Vary Origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

    if ($request_method = OPTIONS) { return 204; }
    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS)$) { return 405; }

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Vary;

    location = /health { proxy_pass http://api:8000; }
    location = /v1/auth/register {
        client_max_body_size 8k;
        limit_req zone=account_requests burst=5 nodelay;
        proxy_pass http://api:8000;
    }
    location = /v1/auth/login {
        client_max_body_size 8k;
        limit_req zone=account_requests burst=5 nodelay;
        proxy_pass http://api:8000;
    }
    location = /v1/sync {
        limit_req zone=backup_requests burst=20 nodelay;
        proxy_pass http://api:8000;
    }
    location = /v1/account {
        client_max_body_size 8k;
        limit_req zone=account_requests burst=5 nodelay;
        proxy_pass http://api:8000;
    }
    location @rate_limited {
        default_type application/json;
        return 429 '{"detail":"Too many requests. Try again shortly."}';
    }
    location / { return 404; }
}

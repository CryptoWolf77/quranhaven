server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, If-None-Match, If-Modified-Since" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag, Last-Modified" always;

    # This service has no accounts, cookies or writable endpoints.
    if ($request_method = OPTIONS) { return 204; }
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/wasm text/css;

    location = /health { default_type text/plain; return 200 "ok\n"; }
    # A byte-preserving transport copy for offline integrity verification.
    # HTML optimizers/analytics may rewrite text/html at the CDN; the worker
    # restores text/html only after checking these original packaged bytes.
    location = /offline-index.bin {
        types { }
        default_type application/octet-stream;
        expires -1;
        gzip off;
        try_files $uri =404;
    }
    location = /v1/manifest.json {
        expires -1;
        gzip off;
        try_files $uri =404;
    }
    location ^~ /v1/ {
        expires 1h;
        # These are gzip FILES; preserve this file layer for Flutter to decode.
        # A proxy may add a separate HTTP compression layer over these bytes.
        gzip off;
        gzip_static off;
        try_files $uri =404;
    }
    location = /v1 { return 301 /v1/; }
    location ~ /\. { return 404; }
    location ~* \.map$ { return 404; }
    location ^~ /api/ { return 404; }
    location /assets/ { expires 1h; try_files $uri =404; }
    location /canvaskit/ { expires 1h; try_files $uri =404; }
    location /icons/ { expires 1h; try_files $uri =404; }
    location ~* \.(?:js|json|html)$ {
        # Revalidate app entry points and worker after deployments.
        expires -1;
        try_files $uri =404;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
